<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Emerald Green Gradient with multiple stops to capture the rich depth -->
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02301c" />
      <stop offset="40%" stop-color="#047843" />
      <stop offset="80%" stop-color="#004d2b" />
      <stop offset="100%" stop-color="#012414" />
    </linearGradient>
    
    <!-- Bright Fluorescent Lime Green Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="50%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#bef264" />
    </linearGradient>
    
    <!-- Soft glow and depth filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(250, 250) scale(1.1)">
    <!-- Swirl 1: Dark Forest Green (Top and Right) -->
    <path d="M -160,20 
             C -200,-120 -60,-220 80,-190 
             C 210,-160 250,-20 180,70 
             C 130,130 50,110 30,60 
             C 10,10 40,-40 80,-50 
             C 110,-58 130,-30 110,-10 
             C 90,10 70,0 70,-20 
             C 70,-40 100,-90 10,-110 
             C -60,-125 -120,-70 -120,-10 
             C -120,40 -140,60 -160,20 Z" 
          fill="url(#forestGrad)" />

    <!-- Swirl 2: Bright Lime Green (Bottom and Left) -->
    <path d="M 160,-20 
             C 200,120 60,220 -80,190 
             C -210,160 -250,20 -180,-70 
             C -130,-130 -50,-110 -30,-60 
             C -10,-10 -40,40 -80,50 
             C -110,58 -130,30 -110,10 
             C -90,-10 -70,0 -70,20 
             C -70,40 -100,90 -10,110 
             C 60,125 120,70 120,10 
             C 120,-40 140,-60 160,-20 Z" 
          fill="url(#limeGrad)" />
  </g>
</svg>
